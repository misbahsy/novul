[package]
name = "novul"
version = "0.1.1"
edition = "2021"

[lib]
name = "novul_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
flate2 = "1.1.10"
ignore = "0.4.33"
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
log = "0.4.34"
mimalloc = "0.1.52"
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
pep440_rs = "0.7.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "gzip"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "process", "io-util", "rt-multi-thread"] }
toml = "1.1.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
